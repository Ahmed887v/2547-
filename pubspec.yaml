name: speak_english
description: SpeakLocal — learn to speak English offline, Duolingo/ELSA style.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  shared_preferences: ^2.3.3
  google_fonts: ^6.2.1
  provider: ^6.1.2
  percent_indicator: ^4.2.3
  confetti: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
